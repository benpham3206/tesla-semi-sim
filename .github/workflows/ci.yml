name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify repository contract
        run: bash scripts/verify-repo.sh

      - name: Project checks
        run: bash scripts/run-hook.sh check

      - name: Project tests
        run: bash scripts/run-hook.sh test

      - name: Smoke evaluations
        run: bash scripts/run-hook.sh eval smoke
